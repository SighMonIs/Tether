{% extends "base.html" %}
{% block title %}Home — Tether{% endblock %}
{% block main_class %}main-content-notes{% endblock %}
{% block content %}
<div class="feed">
  <div class="feed-card notes-card">
    <div class="notes-editor-pane" id="notes-editor-pane">
        <!-- shown when the caret sits inside a link -->
        <div class="link-toolbar" id="link-toolbar">
          <span class="link-bar-url" id="link-bar-url"></span>
          <span class="bubble-sep"></span>
          <button class="toggle-btn" id="link-bar-edit" title="Edit link"><i data-lucide="square-pen"></i></button>
          <button class="toggle-btn" id="link-bar-open" title="Open in new tab"><i data-lucide="external-link"></i></button>
          <button class="toggle-btn" id="link-bar-remove" title="Remove link"><i data-lucide="unlink"></i></button>
        </div>

        <!-- appears over the selection; see initBubbleToolbar in notes.js -->
        <div class="bubble-toolbar" id="bubble-toolbar">
          <button class="toggle-btn" data-cmd="bold" title="Bold"><i data-lucide="bold"></i></button>
          <button class="toggle-btn" data-cmd="italic" title="Italic"><i data-lucide="italic"></i></button>
          <button class="toggle-btn" data-cmd="underline" title="Underline"><i data-lucide="underline"></i></button>
          <button class="toggle-btn" data-cmd="strike" title="Strikethrough"><i data-lucide="strikethrough"></i></button>
          <button class="toggle-btn" data-cmd="code" title="Inline code"><i data-lucide="code"></i></button>
          <span class="bubble-sep"></span>
          <button class="toggle-btn" data-cmd="link" title="Link"><i data-lucide="link"></i></button>
        </div>

        <div class="feed-scroll" id="overview-view">
          <div class="overview-pane">
            <section class="ov-section">
              <div class="ov-header">
                <span class="ov-label">Links</span>
                <button type="button" class="ov-viewall" data-goto="links">View all</button>
              </div>
              <div id="ov-links"></div>
            </section>
            <section class="ov-section">
              <div class="ov-header">
                <span class="ov-label">Notes</span>
                <button type="button" class="ov-viewall" data-goto="notes">View all</button>
              </div>
              <div id="ov-notes"></div>
            </section>
          </div>
        </div>

        <div class="feed-scroll" id="notes-list-view" style="display:none">
          <div class="notes-list-pane">
            <button type="button" class="notes-new-btn" id="notes-new-btn">
              <i data-lucide="plus"></i> New note
            </button>
            <div class="notes-list" id="notes-list"></div>
          </div>
        </div>

        <div class="notes-editor-scroll" id="note-editor-view" style="display:none">
          <span class="notes-save-status" id="notes-save-status"></span>
          <input type="text" id="note-title-input" class="note-title-input" placeholder="Untitled" autocomplete="off">
          <div id="note-editor" class="note-editor"></div>
        </div>

        <div class="feed-scroll" id="ct-view" style="display:none">
          <div class="ct-pane" id="ct-pane"></div>
        </div>

        <div class="feed-scroll" id="links-view" style="display:none">
          <div id="links-container" class="cards-view">
            <div class="loading-state">Loading…</div>
          </div>

        </div>
      </div>
  </div>
</div><!-- /.feed -->

<script>
  // avoid a flash of the overview before notes.js (a module) runs
  const _type = new URLSearchParams(location.search).get("type");
  if (_type === "links" || _type === "notes") {
    document.getElementById("overview-view").style.display = "none";
    document.getElementById(_type === "links" ? "links-view" : "notes-list-view").style.display = "";
  }
</script>

<dialog id="edit-modal" class="modal">
  <div class="modal-content">
    <h2>Edit link</h2>
    <form id="edit-form" onsubmit="saveLink(event)">
      <input type="hidden" id="edit-link-id">
      <div class="form-group">
        <label for="edit-title">Title</label>
        <input type="text" id="edit-title" placeholder="Page title" autocomplete="off">
      </div>
      <div class="form-group">
        <label for="edit-url">URL</label>
        <input type="url" id="edit-url" placeholder="https://…" required autocomplete="off">
      </div>
      <div class="form-group">
        <label>Tags</label>
        <div id="edit-tag-list" class="edit-tag-list"></div>
        <select id="edit-tag-select" class="edit-tag-select" onchange="handleTagSelect(this)">
          <option value="">— Add tag —</option>
          <option value="__new__">＋ Add new tag</option>
        </select>
        <div id="edit-new-tag-row" class="edit-tag-add" style="display:none">
          <input type="text" id="edit-new-tag" placeholder="New tags, comma-separated" autocomplete="off" onkeydown="handleTagKey(event)">
          <button type="button" onclick="addNewEditTags()">Add</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="document.getElementById('edit-modal').close()">Cancel</button>
        <button type="button" class="btn-ghost" id="edit-refresh-btn" onclick="refreshLinkMetadata()">
          <i data-lucide="refresh-cw"></i>
          Refresh metadata
        </button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</dialog>

<dialog id="note-category-modal" class="modal">
  <div class="modal-content">
    <h2>Change category</h2>
    <form id="note-category-form">
      <div class="form-group">
        <label for="note-category-select">Category</label>
        <select id="note-category-select" class="edit-tag-select">
          <option value="0">No category</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="document.getElementById('note-category-modal').close()">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</dialog>
{% endblock %}
{% block scripts %}
<script type="module" src="/static/notes.js?v=067"></script>
{% endblock %}
