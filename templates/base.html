<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tether{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css?v=075">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <meta name="tether-uuid" content="{{ tether_uuid | default('') }}">
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-logo">
      <a href="/" class="sidebar-logo-link">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <rect width="26" height="26" rx="6" fill="var(--accent)"/>
          <line x1="13" y1="5" x2="13" y2="21" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          <polyline points="8,10 13,5 18,10" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="13" cy="21" r="3" fill="white"/>
        </svg>
        <span>Tether</span>
      </a>
      <a href="/settings" class="sidebar-add-btn {% if request.url.path == '/settings' %}active{% endif %}" title="Settings" onclick="{% if request.url.path == '/settings' %}settingsGoBack(event){% endif %}">
        <i data-lucide="settings"></i>
      </a>
    </div>

    {% block sidebar_nav %}
    <div class="sidebar-category-wrap">
      <button class="sidebar-category-trigger" id="sidebar-category-trigger">
        <span id="sidebar-category-label"><i data-lucide="home" class="sidebar-cat-star"></i>Home</span>
        <i data-lucide="chevron-down"></i>
      </button>

      <div class="sidebar-tags-nav" id="sidebar-tags-nav" style="display:none">
        <ul class="sidebar-cats">
          <li>
            <a href="/" class="sidebar-cat-link {% if request.url.path == '/' and not request.query_params.get('tag') and not request.query_params.get('uncategorised') %}active{% endif %}">
              <i data-lucide="home" class="sidebar-cat-star"></i>
              <span class="sidebar-cat-name">Home</span>
            </a>
          </li>
        </ul>
        <div class="sidebar-section-header">
          <span class="sidebar-section-label">Tags</span>
          <button type="button" class="sidebar-section-btn" onclick="openNewTagModal()" title="New tag">
            <i data-lucide="plus"></i>
          </button>
        </div>
        <ul class="sidebar-cats" id="sidebar-cats"></ul>
      </div>
    </div>

    <div class="sidebar-links-row">
      <button type="button" class="sidebar-cat-link" id="tab-links-btn">
        <i data-lucide="link"></i>
        <span class="sidebar-cat-name">Links</span>
      </button>
      <button type="button" class="sidebar-section-btn" onclick="openAddLink()" title="Add link">
        <i data-lucide="plus"></i>
      </button>
    </div>

    <div class="sidebar-notes-nav" id="sidebar-notes-nav">
      <div class="sidebar-section-header">
        <span class="sidebar-section-label">Notes</span>
        <button type="button" class="sidebar-section-btn" id="notes-new-btn" title="New note">
          <i data-lucide="plus"></i>
        </button>
      </div>
      <div class="notes-list" id="notes-list"></div>
    </div>
    {% endblock %}

    <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
  </nav>

  <dialog id="add-link-modal" class="modal">
    <div class="modal-content">
      <div class="modal-tabs">
        <button class="modal-tab active" onclick="switchAddTab('single')">Add Link</button>
        <button class="modal-tab" onclick="switchAddTab('import')">Import Links</button>
      </div>

      <!-- Single link tab -->
      <form id="add-link-form" onsubmit="submitAddLink(event)">
        <div class="form-group">
          <label for="add-link-url">URL</label>
          <input type="url" id="add-link-url" placeholder="https://…" required autocomplete="off">
        </div>
        <div class="form-group">
          <label>Tags</label>
          <div id="add-link-tag-list" class="edit-tag-list"></div>
          <select id="add-link-tag-select" class="edit-tag-select" onchange="handleAddLinkTagSelect(this)">
            <option value="">— Add tag —</option>
            <option value="__new__">＋ Add new tag</option>
          </select>
          <div id="add-link-new-tag-row" class="edit-tag-add" style="display:none">
            <input type="text" id="add-link-new-tag" placeholder="New tags, comma-separated" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addNewLinkTags();}">
            <button type="button" onclick="addNewLinkTags()">Add</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="document.getElementById('add-link-modal').close()">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>

      <!-- Import tab -->
      <form id="import-links-form" onsubmit="submitImportLinks(event)" style="display:none">
        <div class="form-group">
          <label for="import-links-text">Links</label>
          <textarea id="import-links-text" class="import-textarea" placeholder="Paste links here, one per line or separated by commas…" rows="6"></textarea>
        </div>
        <div class="form-group">
          <label>Tags</label>
          <p class="form-note">These tags will be applied to all imported links.</p>
          <div id="import-tag-list" class="edit-tag-list"></div>
          <select id="import-tag-select" class="edit-tag-select" onchange="handleImportTagSelect(this)">
            <option value="">— Add tag —</option>
            <option value="__new__">＋ Add new tag</option>
          </select>
          <div id="import-new-tag-row" class="edit-tag-add" style="display:none">
            <input type="text" id="import-new-tag" placeholder="New tags, comma-separated" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addNewImportTags();}">
            <button type="button" onclick="addNewImportTags()">Add</button>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="document.getElementById('add-link-modal').close()">Cancel</button>
          <button type="submit" class="btn-primary">Import</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="confirm-modal" class="modal">
    <div class="modal-content">
      <p id="confirm-modal-msg" style="margin-bottom:1.25rem;line-height:1.5"></p>
      <div class="modal-actions">
        <button class="btn-ghost" id="confirm-modal-cancel">Cancel</button>
        <button class="btn-danger" id="confirm-modal-ok">Delete</button>
      </div>
    </div>
  </dialog>

  <dialog id="new-tag-modal" class="modal">
    <div class="modal-content">
      <h2>New Tag</h2>
      <form id="new-tag-form" onsubmit="createTag(event)">
        <div class="form-group">
          <label for="new-tag-name">Name</label>
          <input type="text" id="new-tag-name" placeholder="e.g. Design" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="new-tag-color">Color</label>
          <input type="color" id="new-tag-color" value="#6366f1">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="document.getElementById('new-tag-modal').close()">Cancel</button>
          <button type="submit" class="btn-primary">Create</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="edit-tag-modal" class="modal">
    <div class="modal-content">
      <h2>Edit tag</h2>
      <form id="edit-tag-form" onsubmit="saveTag(event)">
        <input type="hidden" id="edit-tag-id">
        <div class="form-group">
          <label for="edit-tag-name">Name</label>
          <input type="text" id="edit-tag-name" placeholder="Tag name" required autocomplete="off">
        </div>
        <div class="form-group">
          <label for="edit-tag-color">Color</label>
          <input type="color" id="edit-tag-color" value="#6366f1">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-ghost" onclick="document.getElementById('edit-tag-modal').close()">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="tag-delete-modal" class="modal">
    <div class="modal-content">
      <h2 id="tag-delete-title">Delete tag</h2>
      <div class="tag-delete-options">
        <label class="tag-delete-option">
          <input type="radio" name="tag-delete-mode" value="move" checked>
          <div>
            <strong>Move to another category</strong>
            <select id="tag-delete-target" class="edit-tag-select"></select>
          </div>
        </label>
        <label class="tag-delete-option">
          <input type="radio" name="tag-delete-mode" value="purge">
          <div>
            <strong>Delete everything in this category</strong>
            <small>Permanently deletes all links and notes tagged with it. This can't be undone.</small>
          </div>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" onclick="document.getElementById('tag-delete-modal').close()">Cancel</button>
        <button type="button" class="btn-danger" onclick="confirmTagDelete()">Continue</button>
      </div>
    </div>
  </dialog>

  <main class="main-content {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <div id="refresh-progress-toast" class="refresh-toast" style="display:none">
    <span id="refresh-toast-text">Refreshing metadata…</span>
    <button class="refresh-toast-close" onclick="hideRefreshToast()" title="Dismiss">
      <i data-lucide="x"></i>
    </button>
  </div>

  <script src="/static/app.js?v=044"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
