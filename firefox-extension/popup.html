<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save to Tether</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#a3a3a3" stroke-width="1.8">
      <circle cx="6" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><line x1="9" y1="12" x2="15" y2="12"/>
    </svg>
    <span class="logo-text">Tether</span>
    <button class="settings-btn" id="open-settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="not-configured" class="state-msg" style="display:none">
    <p>Configure your Tether server URL and API key first.</p>
    <button class="btn-primary" id="go-settings">Open Settings</button>
  </div>

  <form id="main" style="display:none">
    <div class="url-row">
      <img id="favicon" class="favicon" src="" alt="" style="display:none">
      <span id="page-url" class="page-url"></span>
    </div>

    <div class="field">
      <label class="field-label" for="title">Title</label>
      <input type="text" id="title" class="input" placeholder="Page title" autocomplete="off">
    </div>

    <div class="field">
      <label class="field-label" for="desc">Description</label>
      <textarea id="desc" class="input" rows="3" placeholder="What is this about?"></textarea>
    </div>

    <div class="field">
      <label class="field-label" for="category">Tag</label>
      <select id="category" class="input"><option value="">No tag</option></select>
    </div>

    <div class="field">
      <label class="field-label" for="note">Note <span class="optional">(optional)</span></label>
      <textarea id="note" class="input" rows="3" placeholder="Add a note about this link…"></textarea>
    </div>

    <button type="submit" class="btn-primary save-btn" id="save-btn">Save</button>

    <div id="status" class="status" style="display:none"></div>
  </form>

  <script src="popup.js"></script>
</body>
</html>
